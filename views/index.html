<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Airbnb Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#007bff" />
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --accent: #10b981;
      --accent-dark: #0f9a6a;
      --muted: #6b7280;
      --border: rgba(16, 185, 129, 0.25);
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #0f172a;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .hero {
      background: url('/login-hero.jpg') center/cover no-repeat;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      flex: 1.1;
    }
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      height: 100%;
      flex: 1;
    }
    .card {
      width: min(480px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15,23,42,0.12);
      padding: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-mark {
      height: 44px; width: 44px;
      border-radius: 12px;
      background: var(--accent);
      display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 20px;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .muted { color: var(--muted); font-size: 14px; }
    .login-form { margin-top: 18px; display: grid; gap: 12px; }
    .login-form label { font-weight: 600; font-size: 14px; }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      font-size: 15px;
    }
    .login-form input:focus {
      outline: 2px solid rgba(16,185,129,0.3);
      border-color: var(--accent);
      background: #fff;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(16,185,129,0.2);
    }
    .btn:hover { background: var(--accent-dark); }
    .links { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 14px; }
    .links a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .helper { margin-top: 10px; font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .hero { display: none; }
      .panel { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="hero" aria-hidden="true"></div>
    <div class="panel">
      <div class="card">
        <div class="brand">
          <div class="brand-mark">SM</div>
          <div>
            <h1>Welcome back</h1>
            <div class="muted">Sign in to SpotManager</div>
          </div>
        </div>

      <form action="/login" method="POST" class="login-form">
        <div id="loginError" class="muted" style="color:#b91c1c; display:none;">Login failed. Please try again.</div>
        <div>
          <label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone" placeholder="+1 555 555 5555" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="links">
          <span class="muted">Forgot password?</span>
          <a href="#">Contact admin</a>
        </div>
        <div class="helper">By continuing you agree to the terms of use.</div>
      </form>

      <!-- Install PWA UI -->
      <div id="installBox" style="display:none; margin: 16px 0;">
        <button id="installBtn" class="btn" style="background:#0ea5e9; box-shadow:0 10px 24px rgba(14,165,233,0.2);">Install app</button>
      </div>
      <!-- iOS “Add to Home Screen” helper -->
      <div id="iosA2HS" style="display:none; margin: 12px 0; font-size: 0.95em;" class="muted">
        To install: tap <strong>Share</strong> → <strong>Add to Home Screen</strong>.
      </div>
    </div>
    </div>
  </div>


  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('Service Worker Registered!'))
      .catch((error) => console.error('Service Worker Registration Failed:', error));
  }
  const params = new URLSearchParams(window.location.search);
  if (params.get('error') === '1') {
    const err = document.getElementById('loginError');
    if (err) err.style.display = 'block';
  }

  (function () {
    // Basic platform checks
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);

    const installBox = document.getElementById('installBox');
    const installBtn  = document.getElementById('installBtn');
    const iosA2HS     = document.getElementById('iosA2HS');

    // If already "installed", hide everything
    if (isStandalone) return;

    // ---- iOS Safari: no install event -> show hint UI ----
    if (isIOS) {
      iosA2HS.style.display = 'block';
      return; // iOS has no beforeinstallprompt
    }

    // ---- Android/Chrome: capture beforeinstallprompt ----
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar
      e.preventDefault();
      deferredPrompt = e;

      // Show our custom button (only on mobile)
      if (isMobile) installBox.style.display = 'block';
    });

    installBtn?.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      // Show the browser prompt (must be triggered by a user gesture)
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      // outcome is 'accepted' or 'dismissed'
      deferredPrompt = null;

      // Hide the UI either way
      installBox.style.display = 'none';
    });

    // Optional: hide UI once the app gets installed
    window.addEventListener('appinstalled', () => {
      installBox.style.display = 'none';
      iosA2HS.style.display = 'none';
    });
  })();
</script>





</body>
</html>
