<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Airbnb Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#007bff" />
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --accent: #10b981;
      --accent-dark: #0f9a6a;
      --muted: #6b7280;
      --border: rgba(16, 185, 129, 0.25);
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #0f172a;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .hero {
      background: url('/login-hero.jpg') center/cover no-repeat;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      flex: 1.1;
    }
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      height: 100%;
      flex: 1;
    }
    .card {
      width: min(480px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15,23,42,0.12);
      padding: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-mark {
      height: 44px; width: 44px;
      border-radius: 12px;
      background: transparent;
      display: grid; place-items: center;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand h1 { margin: 0; font-size: 20px; }
    .muted { color: var(--muted); font-size: 14px; }
    .login-form { margin-top: 18px; display: grid; gap: 12px; }
    .login-form label { font-weight: 600; font-size: 14px; }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      font-size: 15px;
    }
    .login-form input:focus {
      outline: 2px solid rgba(16,185,129,0.3);
      border-color: var(--accent);
      background: #fff;
    }
    .btn {
      width: 100%;
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(16,185,129,0.2);
      box-sizing: border-box;
    }
    .btn:hover { background: var(--accent-dark); }
    .links { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 14px; }
    .links a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .helper { margin-top: 10px; font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .hero { display: none; }
      .panel { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="hero" aria-hidden="true"></div>
    <div class="panel">
      <div class="card">
        <div class="brand">
          <div class="brand-mark"><img src="/login-logo.svg" alt="SpotManager logo"></div>
          <div>
            <h1>Welcome back</h1>
            <div class="muted">Sign in to SpotManager</div>
          </div>
        </div>

      <form action="/login" method="POST" class="login-form">
        <div id="loginError" class="muted" style="color:#b91c1c; display:none;">Login failed. Please try again.</div>
        <div>
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="links">
          <a href="/forgot-password">Forgot password?</a>
          <a href="#" id="resendLink" style="display:none;">Resend verification</a>
        </div>
        <div class="links">
          <a href="/signup">Create account</a>
        </div>
        <div class="helper">By continuing you agree to the terms of use.</div>
      </form>

      <!-- Install PWA UI -->
      <div id="installBox" style="display:none; margin: 16px 0;">
        <button id="installBtn" class="btn" style="background:#0ea5e9; box-shadow:0 10px 24px rgba(14,165,233,0.2);">Install app</button>
      </div>
      <!-- iOS “Add to Home Screen” helper -->
      <div id="iosA2HS" style="display:none; margin: 12px 0; font-size: 0.95em;" class="muted">
        To install: tap <strong>Share</strong> → <strong>Add to Home Screen</strong>.
      </div>
    </div>
    </div>
  </div>


  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('Service Worker Registered!'))
      .catch((error) => console.error('Service Worker Registration Failed:', error));
  }
  const params = new URLSearchParams(window.location.search);
  const err = document.getElementById('loginError');
  const resend = document.getElementById('resendLink');
  let lastUnverifiedEmail = localStorage.getItem('last_unverified_email') || '';

  // Capture email on form submit
  const loginForm = document.querySelector('form.login-form');
  loginForm?.addEventListener('submit', () => {
    const emailInput = document.getElementById('email');
    if (emailInput && emailInput.value) {
      localStorage.setItem('last_unverified_email', emailInput.value.trim().toLowerCase());
    }
  });

  if (params.get('error') === '1' && err) {
    err.textContent = 'Login failed. Please try again.';
    err.style.display = 'block';
  }
  if (params.get('verify') === '1' && err) {
    err.textContent = 'Please check your email to verify your account.';
    err.style.display = 'block';
  }
  if (params.get('verified') === '1' && err) {
    err.textContent = 'Email verified! You can log in now.';
    err.style.display = 'block';
  }
  if (params.get('unverified') === '1' && err) {
    err.textContent = 'You have not verified your email yet. Please resend the activation link and verify.';
    err.style.display = 'block';
    if (resend) resend.style.display = 'inline';
    const emailInput = document.getElementById('email');
    const triedEmail = params.get('email') || emailInput?.value || lastUnverifiedEmail || '';
    if (emailInput && !emailInput.value && triedEmail) {
      emailInput.value = triedEmail;
    }
    if (triedEmail) {
      lastUnverifiedEmail = triedEmail;
      localStorage.setItem('last_unverified_email', triedEmail);
    }
  } else {
    if (resend) resend.style.display = 'none';
  }

  // Resend verification
  let resendCooldown = null;
  resend?.addEventListener('click', async (e)=>{
    e.preventDefault();
    if (resendCooldown) return;
    const emailInput = document.getElementById('email');
    const email = (emailInput?.value || lastUnverifiedEmail || '').trim();
    if (!email) {
      if (err) {
        err.textContent = 'Please enter your email above to resend the activation link.';
        err.style.display = 'block';
      }
      emailInput?.focus();
      return;
    }
    localStorage.setItem('last_unverified_email', email);
    resend.textContent = 'Sending...';
    resend.style.pointerEvents = 'none';
    await fetch('/api/auth/resend-verification', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    if (err) {
      err.textContent = 'If your account is unverified, we sent a new link.';
      err.style.display = 'block';
    }
    resend.textContent = 'Sent';
    resendCooldown = setTimeout(() => {
      resend.textContent = 'Resend verification';
      resend.style.pointerEvents = 'auto';
      resendCooldown = null;
    }, 30_000);
  });

  (function () {
    // Basic platform checks
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);

    const installBox = document.getElementById('installBox');
    const installBtn  = document.getElementById('installBtn');
    const iosA2HS     = document.getElementById('iosA2HS');

    // If already "installed", hide everything
    if (isStandalone) return;

    // ---- iOS Safari: no install event -> show hint UI ----
    if (isIOS) {
      iosA2HS.style.display = 'block';
      return; // iOS has no beforeinstallprompt
    }

    // ---- Android/Chrome: capture beforeinstallprompt ----
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar
      e.preventDefault();
      deferredPrompt = e;

      // Show our custom button (only on mobile)
      if (isMobile) installBox.style.display = 'block';
    });

    installBtn?.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      // Show the browser prompt (must be triggered by a user gesture)
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      // outcome is 'accepted' or 'dismissed'
      deferredPrompt = null;

      // Hide the UI either way
      installBox.style.display = 'none';
    });

    // Optional: hide UI once the app gets installed
    window.addEventListener('appinstalled', () => {
      installBox.style.display = 'none';
      iosA2HS.style.display = 'none';
    });
  })();
</script>





</body>
</html>
