<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - SpotManager</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#007bff" />
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --accent: #10b981;
      --accent-dark: #0f9a6a;
      --muted: #6b7280;
      --border: rgba(16, 185, 129, 0.25);
      --bg: #f8fafc;
    }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #0f172a;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .hero {
      background: url('/login-hero.jpg') center/cover no-repeat;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      flex: 1.1;
    }
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      height: 100%;
      flex: 1;
    }
    .card {
      width: min(480px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15,23,42,0.12);
      padding: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-mark {
      height: 44px; width: 44px;
      border-radius: 12px;
      background: var(--accent);
      display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 20px;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .muted { color: var(--muted); font-size: 14px; }
    .login-form { margin-top: 18px; display: grid; gap: 12px; }
    .login-form label { font-weight: 600; font-size: 14px; }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      font-size: 15px;
    }
    .login-form input:focus {
      outline: 2px solid rgba(16,185,129,0.3);
      border-color: var(--accent);
      background: #fff;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(16,185,129,0.2);
    }
    .btn:hover { background: var(--accent-dark); }
    .links { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 14px; }
    .links a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .helper { margin-top: 10px; font-size: 13px; color: var(--muted); }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .hero { display: none; }
      .panel { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="hero" aria-hidden="true"></div>
    <div class="panel">
      <div class="card">
        <div class="brand">
          <div class="brand-mark">AO</div>
          <div>
            <h1>Create account</h1>
            <div class="muted">Join SpotManager</div>
          </div>
        </div>

        <form action="/signup" method="POST" class="login-form">
          <div id="signupError" class="muted" style="color:#b91c1c; display:none;">Signup failed. Please try again.</div>
          <div id="signupEmailExists" class="muted" style="color:#b45309; display:none;">That email is already registered. Please log in or use a different email.</div>
          <div>
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Your name" required />
          </div>
          <div>
            <label for="phone">Phone number</label>
            <input type="text" id="phone" name="phone" placeholder="+63 555 555 5555" required />
          </div>
          <div>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn">Create account</button>
          <div class="links" style="justify-content:flex-start;">
            <a href="/" style="text-decoration:none;">Already have an account?</a>
          </div>
          <div class="helper">Admin accounts are created from this form.</div>
        </form>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker Registered!'))
        .catch((error) => console.error('Service Worker Registration Failed:', error));
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      const err = document.getElementById('signupError');
      if (err) err.style.display = 'block';
    }
    if (params.get('email_exists') === '1') {
      const err = document.getElementById('signupEmailExists');
      if (err) err.style.display = 'block';
    }
  </script>
</body>
</html>
