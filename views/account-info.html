<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account information</title>
  <link rel="stylesheet" href="/dashboard-new.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f7fbfa;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .account-card {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
      border: 1px solid #e8f1ef;
    }
    .account-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .account-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f5132;
    }
    .account-sub {
      color: #5f6b6b;
      margin-bottom: 18px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-weight: 600;
      color: #355a5a;
      font-size: 14px;
    }
    input {
      border: 1px solid #d5e6e1;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      background: #f8fdfb;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #3cb28e;
      box-shadow: 0 0 0 3px rgba(60,178,142,0.15);
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(120deg, #2f9e73, #3cb28e);
      color: #fff;
      box-shadow: 0 8px 18px rgba(60,178,142,0.28);
    }
    .btn-ghost {
      background: #eff6f4;
      color: #214c44;
    }
    .btn:active { transform: translateY(1px); }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #285943;
    }
    .error { color: #c53232; }
  </style>
</head>
<body>
  <div class="account-card">
    <div class="account-header">
      <div>
        <div class="account-title">Account information</div>
        <div class="account-sub">Update the details associated with your SpotManager account.</div>
      </div>
      <a href="/dashboard-new" class="btn btn-ghost">← Back</a>
    </div>
    <form id="accountForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" required>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="text" placeholder="+45 12 34 56 78">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
      </div>
      <div id="status" class="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('accountForm');
    const statusEl = document.getElementById('status');
    const cancelBtn = document.getElementById('cancelBtn');
    const fullNameEl = document.getElementById('fullName');
    const phoneEl = document.getElementById('phone');
    const emailEl = document.getElementById('email');

    function setStatus(msg, isError=false) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', !!isError);
    }

    async function loadAccount() {
      try {
        setStatus('Loading account...');
        const res = await fetch('/api/account');
        if (!res.ok) throw new Error('Failed to load account');
        const data = await res.json();
        fullNameEl.value = data.fullName || '';
        phoneEl.value = data.phone || '';
        emailEl.value = data.email || '';
        setStatus('');
      } catch (e) {
        console.error(e);
        setStatus('Could not load account details.', true);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('Saving...');
      try {
        const body = {
          fullName: fullNameEl.value.trim(),
          phone: phoneEl.value.trim(),
          email: emailEl.value.trim()
        };
        const res = await fetch('/api/account', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          if (err.error === 'email_exists') {
            throw new Error('That email is already registered. Please use another email.');
          }
          throw new Error(err.error || 'Save failed');
        }
        await loadAccount();
        setStatus('Account updated successfully.');
      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Save failed', true);
      }
    });

    cancelBtn.addEventListener('click', () => {
      window.location.href = '/dashboard-new';
    });

    loadAccount();
  </script>
</body>
</html>
