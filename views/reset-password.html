<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; }
    .card { width:min(440px,100%); background:#fff; border:1px solid #e5e7eb; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.08); padding:24px 24px 20px; }
    h1 { margin:0 0 8px; }
    .muted { color:#6b7280; margin:0 0 16px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #e5e7eb; background:#f8fafc; font-size:15px; box-sizing:border-box; }
    input:focus { outline:2px solid rgba(16,185,129,0.3); border-color:#10b981; background:#fff; }
    button { width:100%; padding:12px 14px; border-radius:12px; border:none; background:#10b981; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 10px 24px rgba(16,185,129,0.2); }
    .status { margin-top:10px; color:#047857; font-weight:600; }
    .error { color:#b91c1c; }
    .back { margin-top:12px; display:block; text-align:center; color:#0f172a; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="muted">Enter your new password below.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input type="password" id="password" required />
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" required />
      <button type="submit">Update password</button>
      <div id="status" class="status" style="display:none;"></div>
    </form>
    <a class="back" href="/">Back to login</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    document.getElementById('resetForm').addEventListener('submit', async (e)=> {
      e.preventDefault();
      const status = document.getElementById('status');
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (pass !== confirm) {
        status.style.display = 'block';
        status.classList.add('error');
        status.textContent = 'Passwords do not match.';
        return;
      }
      status.classList.remove('error');
      status.style.display = 'block';
      status.textContent = 'Updating...';
      const res = await fetch('/api/auth/reset-password', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, newPassword: pass })
      });
      if (res.ok) {
        status.textContent = 'Password updated. You can log in now.';
      } else {
        status.classList.add('error');
        status.textContent = 'Invalid or expired link.';
      }
    });
  </script>
</body>
</html>
